[package]
name = "torrekin"
version = "0.2.0"
description = "Torrekin - a single-player autobattler"
edition = "2021"

[lib]
name = "torrekin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
