# Push a tag like v0.2.0 (see `npm run release`) to build a new version:
#  1. Windows installer (Tauri) -> attached to a GitHub Release
#  2. Web build + version.json + installer -> GitHub Pages (only if the repo variable DEPLOY_PAGES is "true").
#     Installed copies of the game check version.json there to find updates.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm test
      - run: npx tauri build
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: out/*.exe }
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true

  web:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with: { name: windows-installer, path: dist/downloads }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  pages:
    needs: web
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
